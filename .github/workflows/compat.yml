---
"on":
  # No branch filter: a pull request into a branch with a "/" would run nothing.
  pull_request:
  workflow_dispatch:

name: Compat

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# Runs every preview over the real mods in compat/mods.json. The unit tests only
# ever see fixtures written by hand. A mod is pinned to a commit and measured
# against compat/baseline/<id>.json, so only a new problem fails the check.
# Moving a pin is its own pull request. compat/README.md has the rest.

permissions:
  contents: read

concurrency:
  group: compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: List mods
        id: list
        run: >-
          node -e "const mods = require('./compat/mods.json');
          console.log('matrix=' + JSON.stringify({
          include: mods.map(m => ({ id: m.id })) }))"
          >> "$GITHUB_OUTPUT"

  compat:
    needs: mods
    runs-on: ubuntu-latest
    # A cold checkout adds about a minute to the preview run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mods.outputs.matrix) }}
    name: compat (${{ matrix.id }})
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Keyed on all of mods.json, because a pinned parent moving changes the
      # checkout too. The script leaves a folder at its pinned commit alone.
      - name: Cache mod checkout
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: compat-mods
          key: compat-mods-${{ matrix.id }}-${{ hashFiles('compat/mods.json') }}
      # One runner argument per line, so a path is never split by the shell.
      - name: Check out ${{ matrix.id }}
        env:
          MOD: ${{ matrix.id }}
        run: >-
          node scripts/compat-checkout.js "$MOD" compat-mods > compat-args.txt
      - name: Run the previews
        env:
          MOD: ${{ matrix.id }}
        run: |
          mapfile -t args < compat-args.txt
          npm run compat -- "${args[@]}" --label "$MOD" \
            --baseline "compat/baseline/$MOD.json" --report compat-report.md
