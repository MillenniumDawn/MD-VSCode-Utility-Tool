on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How far to bump the version'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

name: Release pull request

# One release pull request at a time. Two pushes landing together would otherwise race for the same
# branch, and the loser would fail on a stale ref.
concurrency:
  group: release-pull-request
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Starting the Test workflow against the release branch, which is the only way the release
      # pull request gets checked when there is no BUMP_TOKEN.
      actions: write

    env:
      # A personal access token makes the pull request run the test and version workflows itself,
      # against the merge commit. A pull request opened with GITHUB_TOKEN triggers no workflow by
      # design, so on the fallback the last step starts the tests against the branch instead --
      # only the advisory version check is then missing, and the body says so.
      GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
      HAS_BUMP_TOKEN: ${{ secrets.BUMP_TOKEN != '' }}
      RELEASE_BRANCH: release/version-bump
      RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
      # Writes the changelog bullets in the wording CHANGELOG.md uses. Optional: without the key the
      # bullets keep their pull request titles and nothing else changes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Decide whether a release pull request is needed
        id: state
        run: node scripts/release-check.js ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
      # From the last version that shipped, which is the tag itself unless a branch bumped
      # package.json by hand -- then that version has no tag yet and the range starts one release back.
      #
      # This is every pull request in the release, prefix and subsection included. Which of them
      # still need a bullet written is decided per path below, because only the refresh path knows
      # what the open pull request already covers.
      #
      # Scratch files go to $RUNNER_TEMP rather than the working tree, so a stray `git add` can
      # never commit one.
      - name: Collect the changelog bullets
        id: bullets
        if: ${{ steps.state.outputs.bump == 'true' }}
        run: |
          node scripts/pr-bullets.js --tag "${{ steps.state.outputs.lastTag }}" --output "$RUNNER_TEMP/all-bullets.json" >/dev/null
          echo "prs=$(node -p "require('$RUNNER_TEMP/all-bullets.json').pullRequests.join(',')")" >> "$GITHUB_OUTPUT"
      # Says in the log whether the key works, so a rejected or exhausted one is visible instead of
      # looking exactly like a release whose bullets happened not to need rewriting.
      - name: Check the release model key
        if: ${{ steps.state.outputs.bump == 'true' }}
        run: node scripts/rewrite-bullets.js --check
      - name: Look for an open release pull request
        id: existing
        if: ${{ steps.state.outputs.bump == 'true' }}
        run: |
          number=$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Configure git
        if: ${{ steps.state.outputs.bump == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --- No release pull request yet: bump, seed the changelog, open one. ---
      - name: Bump the version and seed the changelog
        id: bump
        if: ${{ steps.state.outputs.bump == 'true' && steps.existing.outputs.number == '' }}
        env:
          ADOPT: ${{ steps.state.outputs.adopt }}
          ADOPTED_FROM: ${{ steps.state.outputs.adoptedFrom }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          git checkout -B "$RELEASE_BRANCH"
          # The pull request that carried a hand-written bump already wrote its own changelog section
          # on main, so it is listed in the body but seeds no second bullet from its title.
          node scripts/select-bullets.js --bullets-file "$RUNNER_TEMP/all-bullets.json" --output "$RUNNER_TEMP/bullets.json" \
            --skip "$ADOPTED_FROM" >/dev/null
          node scripts/rewrite-bullets.js --bullets-file "$RUNNER_TEMP/bullets.json"
          if [ "$ADOPT" = "true" ]; then
            # Keep the version that branch bumped to and add the seeded bullets to the section it
            # wrote, rather than bumping past a version that was never published.
            node scripts/bump-version.js --append --bullets-file "$RUNNER_TEMP/bullets.json" >/dev/null
            echo "next=$VERSION" >> "$GITHUB_OUTPUT"
          else
            node scripts/bump-version.js --type "$RELEASE_TYPE" --bullets-file "$RUNNER_TEMP/bullets.json" >> "$GITHUB_OUTPUT"
          fi
          git add package.json CHANGELOG.md
          version=$(node -p "require('./package.json').version")
          if git diff --cached --quiet; then
            # Adopting a version can leave nothing to commit, when the branch that bumped already
            # wrote every bullet by hand. The pull request still has to exist for that version to
            # reach the marketplace.
            git commit --allow-empty -m "Release v$version"
          else
            git commit -m "Bump version to $version"
          fi
          git push --force origin "HEAD:$RELEASE_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        if: ${{ steps.state.outputs.bump == 'true' && steps.existing.outputs.number == '' }}
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          node scripts/release-pr-body.js --version "$NEXT" --bullets-file "$RUNNER_TEMP/all-bullets.json" \
            --output "$RUNNER_TEMP/release-pr-body.md"
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release v$NEXT - collects every merge until you merge it" \
            --body-file "$RUNNER_TEMP/release-pr-body.md"

      # --- One is already open: catch it up with main and add only the new bullets. ---
      - name: Refresh the open release pull request
        id: refresh
        if: ${{ steps.state.outputs.bump == 'true' && steps.existing.outputs.number != '' }}
        env:
          ADOPTED_FROM: ${{ steps.state.outputs.adoptedFrom }}
          PR: ${{ steps.existing.outputs.number }}
          PRS: ${{ steps.bullets.outputs.prs }}
        run: |
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          ours=$(node -p "require('./package.json').version")
          theirs=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          # Before the merge, and not inside the conflict branch where it is used: a conflicted
          # package.json holds merge markers, and node refuses to load any module from a directory
          # whose package.json will not parse.
          higher=$(node -p "require('./scripts/bump-version').higherVersion('$ours', '$theirs')")

          if ! git merge --no-edit origin/main; then
            # A branch that wrote its own changelog section on main collides with the section this
            # pull request is collecting, and a branch that also bumped the version collides in
            # package.json as well. Both are worth resolving here rather than asking for a hand
            # merge: keep this branch's changelog, which may have been reworded, take the higher
            # version, and carry over the bullets main has that this branch does not.
            conflicts=$(git diff --name-only --diff-filter=U | sort)
            if printf '%s\n' "$conflicts" | grep -qvE '^(CHANGELOG\.md|package\.json)$'; then
              git merge --abort || true
              gh pr comment "$PR" --body "\`main\` moved on and this branch no longer merges cleanly. Resolve the conflict here and the next push to \`main\` will pick up from there."
              exit 0
            fi
            # Only the paths that actually conflicted -- `--ours` fails on a path git merged cleanly.
            git checkout --ours -- $conflicts
            git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/main-changelog.md"
            node scripts/merge-changelog.js --theirs "$RUNNER_TEMP/main-changelog.md" --version "$higher" >/dev/null
            git add package.json CHANGELOG.md
            git commit --no-edit
          elif [ "$ours" != "$theirs" ]; then
            # No conflict, but main carried a version this branch did not have. The merge took
            # main's package.json wholesale, so put the higher of the two back and move the section
            # heading with it.
            node scripts/bump-version.js --set-version "$higher" >/dev/null
          fi

          # The pull request body lists what is already covered, so a bullet reworded by hand is
          # never rewritten and never sent to the model twice -- only genuinely new ones are added.
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/current-body.md"
          covered=$(sed -n 's/^Included pull requests: //p' "$RUNNER_TEMP/current-body.md" | head -1)
          node scripts/select-bullets.js --bullets-file "$RUNNER_TEMP/all-bullets.json" --output "$RUNNER_TEMP/fresh.json" \
            --skip "$ADOPTED_FROM" --covered "$covered" >/dev/null
          node scripts/rewrite-bullets.js --bullets-file "$RUNNER_TEMP/fresh.json"
          node scripts/bump-version.js --append --bullets-file "$RUNNER_TEMP/fresh.json" >/dev/null

          git add package.json CHANGELOG.md
          # Nothing new to say: main moved, but this pull request already covers all of it. Saying
          # so on every merge is noise, so say nothing at all.
          if git diff --cached --quiet && git diff --quiet "origin/$RELEASE_BRANCH" HEAD; then
            echo "::notice::The release pull request already covers everything on main."
            exit 0
          fi
          git diff --cached --quiet || git commit -m "Catch up with main"
          git push origin "HEAD:$RELEASE_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          next=$(node -p "require('./package.json').version")
          gh pr edit "$PR" --title "Release v$next - collects every merge until you merge it"

          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/current-body.md"
          node scripts/release-pr-body.js --version "$next" --bullets-file "$RUNNER_TEMP/all-bullets.json" \
            --existing "$RUNNER_TEMP/current-body.md" --output "$RUNNER_TEMP/updated-body.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/updated-body.md"
          gh pr comment "$PR" --body "Caught up with \`main\`, now releasing \`v$next\`. Included pull requests: $PRS"

      # --- Whichever path ran, test what it pushed. ---
      - name: Run the tests on the release branch
        # The release is what nobody has tested: every branch in it was green on its own, but the
        # collection of them never runs anywhere. A pull request opened and pushed with
        # GITHUB_TOKEN starts no run by design, so this one reached the marketplace with no check
        # on it at all. Dispatching is the exception to that rule and works with the default
        # token, so the tests stop depending on a personal access token being configured.
        #
        # With BUMP_TOKEN set the push already starts a run, and against the merge commit rather
        # than the branch head, which is the better test -- so this only fills in for the fallback.
        if: ${{ env.HAS_BUMP_TOKEN != 'true' && (steps.bump.outputs.pushed == 'true' || steps.refresh.outputs.pushed == 'true') }}
        run: gh workflow run test.yml --ref "$RELEASE_BRANCH"
