on:
  schedule:
    - cron: '17 6 * * 1'
  release:
    types:
      - published
  workflow_dispatch:

name: Close outdated-version issues that are fixed

# One run at a time -- a schedule and a release publish landing together would otherwise both try
# to close the same issue.
concurrency:
  group: close-fixed-issues
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub fires `published` for a prerelease too, and one of those goes out on every push to main.
    # Without this the changelog would be read and the model called on every push instead of on every
    # release. The schedule and dispatch paths carry no release at all, so they pass.
    if: ${{ github.event.release.prerelease != true }}
    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional: with no key set, scripts/close-fixed-issues.js looks at nothing and exits 0.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Close open "outdated version" issues the changelog already fixed
        run: node scripts/close-fixed-issues.js
