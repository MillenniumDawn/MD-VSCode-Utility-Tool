---
"on":
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      release_type:
        description: >-
          How far to bump when a release pull request is opened. Ignored when
          the current version has no tag yet: that run publishes it instead.
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

name: Release

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# One workflow handles the release pull request, pre-release builds, and the
# release itself. The check job decides what this push needs; every other job
# reads its outputs. One run in Actions, with a job graph naming failures.
#
# Never cancel a publish or overlap two: they would race for the same tag,
# marketplace version, or release branch. Each run waits for the one ahead.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    # A stuck job must not park every release behind a six-hour default timeout.
    timeout-minutes: 5
    # Read which pull request a commit came from to recognise a release merge.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      lastTag: ${{ steps.check.outputs.lastTag }}
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      bump: ${{ steps.check.outputs.bump }}
      adopt: ${{ steps.check.outputs.adopt }}
      adoptedFrom: ${{ steps.check.outputs.adoptedFrom }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      # `release` means a release or failed-release fix merged. `bump`
      # means extension changes need a release pull request. A hand bump
      # is adopted into that pull request, never shipped directly. Both false
      # means documentation and CI only: a pre-release, with no release pull
      # request. After a failed publish, only its fix pull request retries it.
      - name: Check version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/release-check.js
          ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}

  # Recheck what users install, once for both channels over the same commit.
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # test:coverage has no pre hook, so compile first, as in test.yml.
      - name: Compile tests
        run: npm run pretest
      - name: Test
        run: npm run test:coverage

  # --- Release pull request: collects changes until someone merges it. ---

  # Runs beside the build. The bot's push tests the release pull request's own
  # merge commit. A release or documentation-only push needs no pull request.
  release-pull-request:
    name: Release pull request
    needs: check
    if: ${{ needs.check.outputs.bump == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Writes use the bot token, not the workflow's read-only token.
    permissions:
      contents: read
    env:
      RELEASE_BRANCH: release/version-bump
      RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
      # Without the optional model key, bullets keep their pull request titles.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    steps:
      # App tokens start tests on pull requests they open; GITHUB_TOKEN cannot.
      - name: Mint the release bot token
        id: app-token
        # v3.2.0
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          # GitHub still accepts the deprecated App ID as a client id.
          client-id: >-
            ${{ secrets.RELEASE_PR_APP_CLIENT_ID || secrets.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      # Keep git authentication in the job environment, never in the checkout.
      - name: Use the bot token for gh and git
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          {
            echo "GH_TOKEN=$TOKEN"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $header"
          } >> "$GITHUB_ENV"
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      # Collect every pull request since the last shipped tag. Only the refresh
      # path knows which have bullets. Keep scratch files outside the tree.
      - name: Collect the changelog bullets
        id: bullets
        env:
          LAST_TAG: ${{ needs.check.outputs.lastTag }}
        run: |
          node scripts/pr-bullets.js --tag "$LAST_TAG" \
            --output "$RUNNER_TEMP/all-bullets.json" >/dev/null
          echo "prs=$(node -p \
            "require('$RUNNER_TEMP/all-bullets.json')\
          .pullRequests.join(',')")" \
            >> "$GITHUB_OUTPUT"
      # Make a rejected or exhausted model key visible in the log.
      - name: Check the release model key
        run: node scripts/rewrite-bullets.js --check
      - name: Look for an open release pull request
        id: existing
        run: |
          number=$(gh pr list --head "$RELEASE_BRANCH" --state open \
            --json number --jq '.[0].number // ""')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      # Read the bot account from the token so an App rename moves its author.
      - name: Configure git
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "users/$SLUG%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      # --- No open release pull request: bump, seed, and open one. ---
      - name: Bump the version and seed the changelog
        id: bump
        if: ${{ steps.existing.outputs.number == '' }}
        env:
          ADOPT: ${{ needs.check.outputs.adopt }}
          ADOPTED_FROM: ${{ needs.check.outputs.adoptedFrom }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git checkout -B "$RELEASE_BRANCH"
          # A hand bump already wrote its changelog, so seed no second bullet.
          node scripts/select-bullets.js \
            --bullets-file "$RUNNER_TEMP/all-bullets.json" \
            --output "$RUNNER_TEMP/bullets.json" \
            --skip "$ADOPTED_FROM" >/dev/null
          node scripts/rewrite-bullets.js \
            --bullets-file "$RUNNER_TEMP/bullets.json"
          if [ "$ADOPT" = "true" ]; then
            # Keep the adopted version rather than bumping an unshipped one.
            node scripts/bump-version.js --append \
              --bullets-file "$RUNNER_TEMP/bullets.json" >/dev/null
            echo "next=$VERSION" >> "$GITHUB_OUTPUT"
          else
            node scripts/bump-version.js --type "$RELEASE_TYPE" \
              --bullets-file "$RUNNER_TEMP/bullets.json" >> "$GITHUB_OUTPUT"
          fi
          git add package.json CHANGELOG.md
          version=$(node -p \
            "require('./scripts/bump-version').readVersion(\
          require('fs').readFileSync('package.json', 'utf8'))")
          if git diff --cached --quiet; then
            # Even an adopted version with no new bullets needs a pull request.
            git commit --allow-empty -m "Release v$version"
          else
            git commit -m "Bump version to $version"
          fi
          # Replace a closed leftover only if nobody pushed since the checkout.
          git push --force-with-lease origin "HEAD:$RELEASE_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        if: ${{ steps.existing.outputs.number == '' }}
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          node scripts/release-pr-body.js --version "$NEXT" \
            --bullets-file "$RUNNER_TEMP/all-bullets.json" \
            --output "$RUNNER_TEMP/release-pr-body.md"
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release v$NEXT - collects every merge until you merge it" \
            --body-file "$RUNNER_TEMP/release-pr-body.md"

      # --- One is open: catch up with main and add only the new bullets. ---
      - name: Refresh the open release pull request
        id: refresh
        if: ${{ steps.existing.outputs.number != '' }}
        env:
          ADOPTED_FROM: ${{ needs.check.outputs.adoptedFrom }}
          PR: ${{ steps.existing.outputs.number }}
          PRS: ${{ steps.bullets.outputs.prs }}
        run: |
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          # readVersion accepts only a plain version, never a payload.
          ours=$(node -p \
            "require('./scripts/bump-version').readVersion(\
          require('fs').readFileSync('package.json', 'utf8'))")
          theirs=$(git show origin/main:package.json | node -p \
            "require('./scripts/bump-version').readVersion(\
          require('fs').readFileSync(0, 'utf8'))")
          # Read before merging: Node cannot load a conflicted package.json.
          # Pass versions as data through the environment, not as JavaScript.
          higher=$(OURS="$ours" THEIRS="$theirs" node -p \
            "require('./scripts/bump-version').higherVersion(\
          process.env.OURS, process.env.THEIRS)")

          # Rebuild from main, preserving only seeded bullets main never had.
          # Read all three inputs before the merge moves the merge base.
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/main-changelog.md"
          git show "$(git merge-base HEAD origin/main):CHANGELOG.md" \
            > "$RUNNER_TEMP/previous-main-changelog.md"
          cp CHANGELOG.md "$RUNNER_TEMP/release-changelog.md"
          rebuild_changelog() {
            node scripts/merge-changelog.js \
              --main "$RUNNER_TEMP/main-changelog.md" \
              --previous-main "$RUNNER_TEMP/previous-main-changelog.md" \
              --release "$RUNNER_TEMP/release-changelog.md" \
              --version "$higher" >/dev/null
          }

          if ! git merge --no-edit origin/main; then
            # Resolve only changelog and version collisions.
            conflicts=$(git diff --name-only --diff-filter=U | sort)
            if printf '%s\n' "$conflicts" \
              | grep -qvE '^(CHANGELOG\.md|package\.json)$'; then
              git merge --abort || true
              gh pr comment "$PR" --body "\`main\` moved on and this branch \
          no longer merges cleanly. Resolve the conflict here and the next \
          push to \
          \`main\` will pick up from there."
              exit 0
            fi
            # Take main's package changes; the rebuild writes our version back.
            # Only conflicted paths can be checked out with --theirs.
            for conflict in $conflicts; do
              git checkout --theirs -- "$conflict"
            done
            rebuild_changelog
            git add package.json CHANGELOG.md
            git commit --no-edit
          else
            # A clean merge still needs main's changelog and the higher version.
            rebuild_changelog
          fi

          # Send only genuinely new bullets to the model, not hand-edited ones.
          gh pr view "$PR" --json body --jq .body \
            > "$RUNNER_TEMP/current-body.md"
          covered=$(sed -n 's/^Included pull requests: //p' \
            "$RUNNER_TEMP/current-body.md" | head -1)
          node scripts/select-bullets.js \
            --bullets-file "$RUNNER_TEMP/all-bullets.json" \
            --output "$RUNNER_TEMP/fresh.json" \
            --skip "$ADOPTED_FROM" --covered "$covered" >/dev/null
          node scripts/rewrite-bullets.js \
            --bullets-file "$RUNNER_TEMP/fresh.json"
          node scripts/bump-version.js --append \
            --bullets-file "$RUNNER_TEMP/fresh.json" >/dev/null

          git add package.json CHANGELOG.md
          # Say nothing when main moved but this pull request already covers it.
          if git diff --cached --quiet \
            && git diff --quiet "origin/$RELEASE_BRANCH" HEAD; then
            echo "::notice::The release pull request already covers everything \
          on main."
            exit 0
          fi
          git diff --cached --quiet || git commit -m "Catch up with main"
          # Push first: a failed body update must never record unpushed bullets.
          git push origin "HEAD:$RELEASE_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

          next=$(node -p \
            "require('./scripts/bump-version').readVersion(\
          require('fs').readFileSync('package.json', 'utf8'))")
          gh pr edit "$PR" \
            --title "Release v$next - collects every merge until you merge it"

          gh pr view "$PR" --json body --jq .body \
            > "$RUNNER_TEMP/current-body.md"
          node scripts/release-pr-body.js --version "$next" \
            --bullets-file "$RUNNER_TEMP/all-bullets.json" \
            --existing "$RUNNER_TEMP/current-body.md" \
            --output "$RUNNER_TEMP/updated-body.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/updated-body.md"
          gh pr comment "$PR" --body "Caught up with \`main\`, now releasing \
          \`v$next\`. Included pull requests: $PRS"

  # --- Pre-release: every push to main that is not itself a release. ---

  # Build beside verify, but publish only when both pass. A release push already
  # ships the same code, so it needs no pre-release.
  build-pre-release:
    name: "Pre-release: Build"
    needs: check
    if: ${{ needs.check.outputs.release != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.find_vsix.outputs.vsix }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Change this checkout's version only. Leave CHANGELOG alone.
      - name: Resolve the pre-release version
        id: version
        run: node scripts/prerelease-version.js --apply
      - name: Package the pre-release VSIX
        run: npm run package:pre-release
      - name: Find VSIX
        id: find_vsix
        run: |
          packages=(*.vsix)
          vsix=${packages[0]}
          if [ ! -f "$vsix" ]; then
            echo "::error::No .vsix file found after packaging"
            exit 1
          fi
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
      # All three publish runners receive the same bytes.
      - name: Upload the VSIX
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pre-release-vsix
          path: ${{ steps.find_vsix.outputs.vsix }}
          if-no-files-found: error
          retention-days: 5

  pre-release-marketplace:
    name: "Pre-release: VS Code Marketplace"
    needs: [build-pre-release, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSIX: ${{ needs.build-pre-release.outputs.vsix }}
    steps:
      # vsce is a dev dependency, even though the VSIX was built elsewhere.
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pre-release-vsix
      # Missing tokens fail, duplicates pass, and transient failures retry.
      - name: Publish to VS Code Marketplace
        run: >-
          node scripts/publish-extension.js --registry marketplace
          --vsix "$VSIX" --pre-release

  # ovsx reads the pre-release flag from the manifest. Only quick retries here:
  # the next main push supersedes this build.
  pre-release-open-vsx:
    name: "Pre-release: Open VSX"
    needs: [build-pre-release, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VSIX: ${{ needs.build-pre-release.outputs.vsix }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pre-release-vsix
      - name: Publish to Open VSX Registry
        run: >-
          node scripts/publish-extension.js --registry open-vsx --vsix "$VSIX"

  pre-release-github:
    name: "Pre-release: GitHub prerelease"
    needs: [build-pre-release, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The bot creates the prerelease; the workflow token only reads.
    permissions:
      contents: read
    steps:
      - name: Mint the release bot token
        id: app-token
        # v3.2.0
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: >-
            ${{ secrets.RELEASE_PR_APP_CLIENT_ID || secrets.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pre-release-vsix
      # Generated notes would start one release behind, at the stable tag.
      - name: Create GitHub prerelease
        # v3.0.3
        uses: >-
          softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.build-pre-release.outputs.tag }}
          name: Pre-release ${{ needs.build-pre-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Pre-release build of ${{ github.sha }}.

            The same build is on the VS Code Marketplace and Open VSX on the
            pre-release channel. "Switch to Pre-Release Version" in the
            extension view installs it; the `.vsix` below is for a hand install.
          files: ${{ needs.build-pre-release.outputs.vsix }}

  # --- Release: only a release or failed-release fix merge. ---

  build-release:
    name: "Release: Build"
    needs: check
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.find_vsix.outputs.vsix }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Package VSIX
        run: npm run package
      - name: Find VSIX
        id: find_vsix
        run: |
          packages=(*.vsix)
          vsix=${packages[0]}
          if [ ! -f "$vsix" ]; then
            echo "::error::No .vsix file found after packaging"
            exit 1
          fi
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
      - name: Upload the VSIX
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-vsix
          path: ${{ steps.find_vsix.outputs.vsix }}
          if-no-files-found: error
          retention-days: 5

  # Sibling registry jobs keep an outage from taking the other registry down.
  # Quick retries handle transient failures; patient jobs take over if needed.
  # Duplicates pass so a half-finished release can safely be published again.
  release-marketplace:
    name: "Release: VS Code Marketplace"
    needs: [build-release, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSIX: ${{ needs.build-release.outputs.vsix }}
    outputs:
      transient: ${{ steps.publish.outputs.transient }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-vsix
      - name: Publish to VS Code Marketplace
        id: publish
        run: >-
          node scripts/publish-extension.js --registry marketplace
          --vsix "$VSIX"

  # v1.1.37 exhausted quick retries on three 503s; Marketplace needs the same
  # patient retry as Open VSX rather than a fix pull request for a good build.
  release-marketplace-retry:
    name: "Release: VS Code Marketplace (retry later)"
    needs: [build-release, release-marketplace]
    if: >-
      ${{ always() && needs['release-marketplace'].result == 'failure' &&
      needs['release-marketplace'].outputs.transient == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSIX: ${{ needs.build-release.outputs.vsix }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-vsix
      - name: Publish to VS Code Marketplace, patiently
        run: >-
          node scripts/publish-extension.js --registry marketplace
          --vsix "$VSIX" --schedule patient

  release-open-vsx:
    name: "Release: Open VSX"
    needs: [build-release, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VSIX: ${{ needs.build-release.outputs.vsix }}
    outputs:
      transient: ${{ steps.publish.outputs.transient }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-vsix
      - name: Publish to Open VSX Registry
        id: publish
        run: >-
          node scripts/publish-extension.js --registry open-vsx --vsix "$VSIX"

  # Wait five, ten, then fifteen minutes before giving up on a registry outage.
  # This stays inside the run: dispatching would queue behind its own publish
  # concurrency group. Main pushes queue while these patient retries wait.
  release-open-vsx-retry:
    name: "Release: Open VSX (retry later)"
    needs: [build-release, release-open-vsx]
    if: >-
      ${{ always() && needs['release-open-vsx'].result == 'failure' &&
      needs['release-open-vsx'].outputs.transient == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VSIX: ${{ needs.build-release.outputs.vsix }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-vsix
      - name: Publish to Open VSX Registry, patiently
        run: >-
          node scripts/publish-extension.js --registry open-vsx
          --vsix "$VSIX" --schedule patient

  # The release writes the tag, which says this version shipped. At least one
  # registry must accept the build, including a patient retry. Never tag a run
  # stopped by hand. A repeated publish updates the release and VSIX in place.
  release-github:
    name: "Release: GitHub release"
    needs:
      - check
      - build-release
      - verify
      - release-marketplace
      - release-marketplace-retry
      - release-open-vsx
      - release-open-vsx-retry
    if: >-
      ${{ !cancelled() && needs.build-release.result == 'success' &&
      (needs.release-marketplace.result == 'success' ||
      needs.release-marketplace-retry.result == 'success' ||
      needs.release-open-vsx.result == 'success' ||
      needs.release-open-vsx-retry.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The bot creates the release; the workflow token only reads.
    permissions:
      contents: read
    steps:
      # The App token fires release: published so close-fixed-issues runs.
      - name: Mint the release bot token
        id: app-token
        # v3.2.0
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: >-
            ${{ secrets.RELEASE_PR_APP_CLIENT_ID || secrets.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
      # v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-vsix
      - name: Create GitHub Release
        # v3.0.3
        uses: >-
          softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: ${{ needs.build-release.outputs.vsix }}

  # A failed release leaves a branch and draft pull request to fix it on. Its
  # merge retries the same version, without a second release pull request.
  # Pre-releases need none; registry outages get one only after patient retries.
  release-failed:
    name: "Release: Open a fix pull request"
    needs:
      - check
      - verify
      - build-release
      - release-marketplace
      - release-marketplace-retry
      - release-open-vsx
      - release-open-vsx-retry
      - release-github
    # A cancelled retry must not open a fix for the first registry failure.
    # Keep folded expression lines equally indented so no newline survives.
    if: >-
      ${{ !cancelled() && needs.check.outputs.release == 'true' &&
      (needs.verify.result == 'failure' ||
      needs['build-release'].result == 'failure' ||
      needs['release-github'].result == 'failure' ||
      needs['release-marketplace-retry'].result == 'failure' ||
      (needs['release-marketplace'].result == 'failure' &&
      needs['release-marketplace-retry'].result != 'success') ||
      needs['release-open-vsx-retry'].result == 'failure' ||
      (needs['release-open-vsx'].result == 'failure' &&
      needs['release-open-vsx-retry'].result != 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Writes use the bot; the workflow token reads the failure log.
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      BRANCH: fix/release-v${{ needs.check.outputs.version }}
    steps:
      - name: Mint the release bot token
        id: app-token
        # v3.2.0
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: >-
            ${{ secrets.RELEASE_PR_APP_CLIENT_ID || secrets.RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      # Keep git authentication in the job environment, never in the checkout.
      - name: Use the bot token for gh and git
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          {
            echo "GH_TOKEN=$TOKEN"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $header"
          } >> "$GITHUB_ENV"
      - name: Configure git
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "users/$SLUG%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      # List only failed jobs, plus a note if no registry earned a release tag.
      - name: Write the failure summary
        id: summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-failure.md"
          jobs="$RUNNER_TEMP/jobs.json"
          # A rate-limited job list must not prevent opening the fix branch.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --paginate --jq '.jobs[]' > "$jobs" || : > "$jobs"
          {
            echo "Publishing **$TAG** failed."
            echo
            echo "This branch is here to fix it on. It carries one empty \
          commit \
          and nothing else, so"
            echo "there is nothing to clean up -- push the fix, mark this \
          ready \
          and merge it. **That"
            echo "merge publishes $TAG again**: every target treats a version \
          it already has as done,"
            echo "so only the ones that failed actually change. \
          No release pull request is involved."
            echo
            echo "If the fix changes what ships -- anything outside \
          \`.github/\` and documentation --"
            echo "bump \`package.json\` and the \`Unreleased\` heading in \
          \`CHANGELOG.md\` on this branch"
            echo "first (\`node scripts/bump-version.js --type patch\`), \
          so the new build goes out"
            echo "under its own version instead of replacing $TAG \
          on the targets that already have it."
            echo
            echo "### What failed"
            echo
            if [ -s "$jobs" ]; then
              jq -r \
          'select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"' \
                "$jobs"
            else
              echo "- The job list could not be read; open the run below."
            fi
            echo
            echo "Every job not listed here passed or did not need to run, \
          so any other target is"
            echo "already published. Re-running just a failed job from"
            echo "[the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/\
          actions/runs/$GITHUB_RUN_ID)"
            echo "republishes only that one; both registries treat a version \
          that is already up as"
            echo "done rather than as an error."
            if jq -e \
              'select(.name == "Release: GitHub release" and
              .conclusion == "skipped")' \
              "$jobs" >/dev/null; then
              echo
              echo "No GitHub release was created: neither registry took \
          the build, so there is no"
              echo "$TAG tag yet and nothing is published anywhere."
            fi
          } > "$body"
          echo "body=$body" >> "$GITHUB_OUTPUT"
      - name: Open or update the fix pull request
        env:
          BODY: ${{ steps.summary.outputs.body }}
        run: |
          set -euo pipefail
          title="Release $TAG failed to publish"

          # An open fix belongs to its author. Report this run, never overwrite
          # their work. Restart a closed leftover with no open pull request.
          if git ls-remote --exit-code --heads origin "$BRANCH" \
            >/dev/null 2>&1; then
            number=$(gh pr list --head "$BRANCH" --state open --json number \
              --jq '.[0].number // empty')
            if [ -n "$number" ]; then
              gh pr comment "$number" --body-file "$BODY"
              echo "::notice::$title -- reported on pull request #$number."
              exit 0
            fi
          fi
          git checkout -B "$BRANCH" "$GITHUB_SHA"
          git commit --allow-empty -m "$title"
          # Replace only what the checkout saw, never a push that landed since.
          git push --force-with-lease origin "HEAD:$BRANCH"

          # The eventual fix labels itself; this draft is only a workspace.
          url=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "$title" --body-file "$BODY")
          echo "::notice::$title -- opened $url."
