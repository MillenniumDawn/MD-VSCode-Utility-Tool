on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

name: Release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    # Publishes when the version in package.json has no tag yet. When the tag is taken, this push
    # carries no bump -- version-bump.yml opens a release pull request for it, so nothing fails
    # here. The script owns that decision for both workflows.
    - name: Check version
      id: check
      run: node scripts/release-check.js ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}

  publish:
    needs: check
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm test
    - name: Package VSIX
      run: npm run package
    - name: Find VSIX
      id: find_vsix
      run: |
        vsix=$(ls *.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::No .vsix file found after packaging"
          exit 1
        fi
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
    - name: Publish to VS Code Marketplace
      if: ${{ env.VSCE_PAT != '' }}
      run: |
        set -o pipefail
        out=$(npx --no-install @vscode/vsce publish --packagePath "${{ steps.find_vsix.outputs.vsix }}" --pat "$VSCE_PAT" 2>&1 | tee /dev/stderr) || {
          if echo "$out" | grep -qi "already exists"; then
            echo "::warning::Version already exists on the Marketplace; treating as already published."
            exit 0
          fi
          exit 1
        }
    - name: Publish to Open VSX Registry
      if: ${{ env.OPEN_VSX_TOKEN != '' }}
      uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
      with:
        packagePath: ${{ steps.find_vsix.outputs.vsix }}
        pat: ${{ env.OPEN_VSX_TOKEN }}
        registryUrl: https://open-vsx.org
    - name: Create GitHub Release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        tag_name: ${{ needs.check.outputs.tag }}
        name: ${{ needs.check.outputs.tag }}
        generate_release_notes: true
        files: ${{ steps.find_vsix.outputs.vsix }}
