on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'How far to bump when a release pull request is opened. Ignored when the current version has no tag yet: that run publishes it instead.'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

name: Release

# Everything a push to main can lead to lives in this one workflow: the release pull request that
# collects the merges, the pre-release build of each of them, and the release itself when that pull
# request is merged. They used to be two workflows that each started with the same question --
# "what is this push?" -- and answered it separately; now the question is asked once, in `check`,
# and every job below reads the answer from its outputs. One run in the Actions list per push, and
# a job graph that names which part broke instead of hiding it in a step log.
#
# One run at a time. Two of these overlapping would race for the same tag, the same marketplace
# version, or the same release branch. A superseded pre-release build used to be cancelled rather
# than queued, which a release must never be, so everything shares the release's rule: a run
# waits, it is not dropped.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    # Reading which pull request a commit came from is how "did this merge the release pull
    # request?" is answered.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      lastTag: ${{ steps.check.outputs.lastTag }}
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      bump: ${{ steps.check.outputs.bump }}
      adopt: ${{ steps.check.outputs.adopt }}
      adoptedFrom: ${{ steps.check.outputs.adoptedFrom }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    # `release` is true when this push merged the release pull request and its version has no tag
    # yet, or when it merged the fix pull request that a failed publish opened below -- then the
    # version goes out again, tag or no tag. `bump` is true when the extension itself changed since
    # the last tag, so a release pull request has to carry the next version -- a branch that bumped
    # package.json by itself has that bump carried into the release pull request rather than
    # shipping on its own, so a run of merges becomes one release instead of one release each. Both
    # false means only documentation and CI changed: a pre-release build and nothing else. The
    # script owns that decision for every job in this file.
    - name: Check version
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node scripts/release-check.js ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}

  # Every branch in main was green on its own, but what goes out is installed by real users, so it
  # is checked again here. Once, for both channels: a release push and a pre-release push run the
  # same suite over the same commit.
  verify:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm test

  # --- Release pull request: every push that changed what ships, until that pull request merges. ---

  # Runs beside the pre-release build, not after the tests: the release pull request it pushes gets
  # the Test and Version workflows on its own merge commit, which is the run that matters. Skipped on
  # a release push and on a documentation-only push, because `bump` is false for both.
  release-pull-request:
    name: Release pull request
    needs: check
    if: ${{ needs.check.outputs.bump == 'true' }}
    runs-on: ubuntu-latest
    # Everything below writes as the bot, through GH_TOKEN and the checkout token, so the
    # workflow's own token needs nothing beyond reading the tree.
    permissions:
      contents: read
    env:
      RELEASE_BRANCH: release/version-bump
      RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
      # Writes the changelog bullets in the wording CHANGELOG.md uses. Optional: without the key the
      # bullets keep their pull request titles and nothing else changes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
    steps:
    # Everything here is done as the MD Utilities Release Bot rather than as the workflow itself.
    # A pull request opened with GITHUB_TOKEN starts no run by design, so the release used to
    # reach the marketplace unchecked; a pull request opened with an App installation token does
    # start one, against the merge commit, and unlike a personal access token it leaves no person
    # as the author of the release.
    - name: Mint the release bot token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.RELEASE_PR_APP_ID }}
        private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
    # A job-level `env` cannot read the `steps` context, so the token every `gh` step below wants
    # is exported once here instead. The action masks it, so it stays redacted in the log.
    - name: Use the bot token for gh
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
    # From the last version that shipped, which is the tag itself unless a branch bumped
    # package.json by hand -- then that version has no tag yet and the range starts one release back.
    #
    # This is every pull request in the release, prefix and subsection included. Which of them
    # still need a bullet written is decided per path below, because only the refresh path knows
    # what the open pull request already covers.
    #
    # Scratch files go to $RUNNER_TEMP rather than the working tree, so a stray `git add` can
    # never commit one.
    - name: Collect the changelog bullets
      id: bullets
      env:
        LAST_TAG: ${{ needs.check.outputs.lastTag }}
      run: |
        node scripts/pr-bullets.js --tag "$LAST_TAG" --output "$RUNNER_TEMP/all-bullets.json" >/dev/null
        echo "prs=$(node -p "require('$RUNNER_TEMP/all-bullets.json').pullRequests.join(',')")" >> "$GITHUB_OUTPUT"
    # Says in the log whether the key works, so a rejected or exhausted one is visible instead of
    # looking exactly like a release whose bullets happened not to need rewriting.
    - name: Check the release model key
      run: node scripts/rewrite-bullets.js --check
    - name: Look for an open release pull request
      id: existing
      run: |
        number=$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // ""')
        echo "number=$number" >> "$GITHUB_OUTPUT"
    # The bot's own account, read from the token that was just minted rather than written out
    # here, so renaming the App moves the commit author with it.
    - name: Configure git
      env:
        SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        id=$(gh api "users/$SLUG%5Bbot%5D" --jq .id)
        git config user.name "$SLUG[bot]"
        git config user.email "$id+$SLUG[bot]@users.noreply.github.com"

    # --- No release pull request yet: bump, seed the changelog, open one. ---
    - name: Bump the version and seed the changelog
      id: bump
      if: ${{ steps.existing.outputs.number == '' }}
      env:
        ADOPT: ${{ needs.check.outputs.adopt }}
        ADOPTED_FROM: ${{ needs.check.outputs.adoptedFrom }}
        VERSION: ${{ needs.check.outputs.version }}
      run: |
        git checkout -B "$RELEASE_BRANCH"
        # The pull request that carried a hand-written bump already wrote its own changelog section
        # on main, so it is listed in the body but seeds no second bullet from its title.
        node scripts/select-bullets.js --bullets-file "$RUNNER_TEMP/all-bullets.json" --output "$RUNNER_TEMP/bullets.json" \
          --skip "$ADOPTED_FROM" >/dev/null
        node scripts/rewrite-bullets.js --bullets-file "$RUNNER_TEMP/bullets.json"
        if [ "$ADOPT" = "true" ]; then
          # Keep the version that branch bumped to and add the seeded bullets to the section it
          # wrote, rather than bumping past a version that was never published.
          node scripts/bump-version.js --append --bullets-file "$RUNNER_TEMP/bullets.json" >/dev/null
          echo "next=$VERSION" >> "$GITHUB_OUTPUT"
        else
          node scripts/bump-version.js --type "$RELEASE_TYPE" --bullets-file "$RUNNER_TEMP/bullets.json" >> "$GITHUB_OUTPUT"
        fi
        git add package.json CHANGELOG.md
        version=$(node -p "require('./scripts/bump-version').readVersion(require('fs').readFileSync('package.json', 'utf8'))")
        if git diff --cached --quiet; then
          # Adopting a version can leave nothing to commit, when the branch that bumped already
          # wrote every bullet by hand. The pull request still has to exist for that version to
          # reach the marketplace.
          git commit --allow-empty -m "Release v$version"
        else
          git commit -m "Bump version to $version"
        fi
        git push --force origin "HEAD:$RELEASE_BRANCH"
        echo "pushed=true" >> "$GITHUB_OUTPUT"
    - name: Open the release pull request
      if: ${{ steps.existing.outputs.number == '' }}
      env:
        NEXT: ${{ steps.bump.outputs.next }}
      run: |
        node scripts/release-pr-body.js --version "$NEXT" --bullets-file "$RUNNER_TEMP/all-bullets.json" \
          --output "$RUNNER_TEMP/release-pr-body.md"
        gh pr create \
          --base main \
          --head "$RELEASE_BRANCH" \
          --title "Release v$NEXT - collects every merge until you merge it" \
          --body-file "$RUNNER_TEMP/release-pr-body.md"

    # --- One is already open: catch it up with main and add only the new bullets. ---
    - name: Refresh the open release pull request
      id: refresh
      if: ${{ steps.existing.outputs.number != '' }}
      env:
        ADOPTED_FROM: ${{ needs.check.outputs.adoptedFrom }}
        PR: ${{ steps.existing.outputs.number }}
        PRS: ${{ steps.bullets.outputs.prs }}
      run: |
        git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
        # readVersion refuses anything but a plain three-part version, so neither of these can
        # carry a payload into the expressions and shell commands below.
        ours=$(node -p "require('./scripts/bump-version').readVersion(require('fs').readFileSync('package.json', 'utf8'))")
        theirs=$(git show origin/main:package.json | node -p "require('./scripts/bump-version').readVersion(require('fs').readFileSync(0, 'utf8'))")
        # Before the merge, and not inside the conflict branch where it is used: a conflicted
        # package.json holds merge markers, and node refuses to load any module from a directory
        # whose package.json will not parse.
        #
        # Through the environment rather than interpolated into the expression: a version spliced
        # into JS source is compiled, not read.
        higher=$(OURS="$ours" THEIRS="$theirs" node -p "require('./scripts/bump-version').higherVersion(process.env.OURS, process.env.THEIRS)")

        if ! git merge --no-edit origin/main; then
          # A branch that wrote its own changelog section on main collides with the section this
          # pull request is collecting, and a branch that also bumped the version collides in
          # package.json as well. Both are worth resolving here rather than asking for a hand
          # merge: keep this branch's changelog, which may have been reworded, take the higher
          # version, and carry over the bullets main has that this branch does not.
          conflicts=$(git diff --name-only --diff-filter=U | sort)
          if printf '%s\n' "$conflicts" | grep -qvE '^(CHANGELOG\.md|package\.json)$'; then
            git merge --abort || true
            gh pr comment "$PR" --body "\`main\` moved on and this branch no longer merges cleanly. Resolve the conflict here and the next push to \`main\` will pick up from there."
            exit 0
          fi
          # Only the paths that actually conflicted -- `--ours` fails on a path git merged cleanly.
          git checkout --ours -- $conflicts
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/main-changelog.md"
          node scripts/merge-changelog.js --theirs "$RUNNER_TEMP/main-changelog.md" --version "$higher" >/dev/null
          git add package.json CHANGELOG.md
          git commit --no-edit
        elif [ "$ours" != "$theirs" ]; then
          # No conflict, but main carried a version this branch did not have. The merge took
          # main's package.json wholesale, so put the higher of the two back and move the section
          # heading with it.
          node scripts/bump-version.js --set-version "$higher" >/dev/null
        fi

        # The pull request body lists what is already covered, so a bullet reworded by hand is
        # never rewritten and never sent to the model twice -- only genuinely new ones are added.
        gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/current-body.md"
        covered=$(sed -n 's/^Included pull requests: //p' "$RUNNER_TEMP/current-body.md" | head -1)
        node scripts/select-bullets.js --bullets-file "$RUNNER_TEMP/all-bullets.json" --output "$RUNNER_TEMP/fresh.json" \
          --skip "$ADOPTED_FROM" --covered "$covered" >/dev/null
        node scripts/rewrite-bullets.js --bullets-file "$RUNNER_TEMP/fresh.json"
        node scripts/bump-version.js --append --bullets-file "$RUNNER_TEMP/fresh.json" >/dev/null

        git add package.json CHANGELOG.md
        # Nothing new to say: main moved, but this pull request already covers all of it. Saying
        # so on every merge is noise, so say nothing at all.
        if git diff --cached --quiet && git diff --quiet "origin/$RELEASE_BRANCH" HEAD; then
          echo "::notice::The release pull request already covers everything on main."
          exit 0
        fi
        git diff --cached --quiet || git commit -m "Catch up with main"
        git push origin "HEAD:$RELEASE_BRANCH"
        echo "pushed=true" >> "$GITHUB_OUTPUT"

        next=$(node -p "require('./scripts/bump-version').readVersion(require('fs').readFileSync('package.json', 'utf8'))")
        gh pr edit "$PR" --title "Release v$next - collects every merge until you merge it"

        gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/current-body.md"
        node scripts/release-pr-body.js --version "$next" --bullets-file "$RUNNER_TEMP/all-bullets.json" \
          --existing "$RUNNER_TEMP/current-body.md" --output "$RUNNER_TEMP/updated-body.md"
        gh pr edit "$PR" --body-file "$RUNNER_TEMP/updated-body.md"
        gh pr comment "$PR" --body "Caught up with \`main\`, now releasing \`v$next\`. Included pull requests: $PRS"

    # Nothing dispatches the tests: the release is what nobody has tested -- every branch in it was
    # green on its own, but the collection of them runs nowhere else -- and the bot's push starts
    # the Test and Version workflows against the merge commit by itself.

  # --- Pre-release: every push to main that is not itself a release. ---

  # Skipped on the release push. That commit carries a version and a changelog and nothing else, so
  # publishing it to the pre-release channel as well would ship the same code twice.
  build-pre-release:
    name: "Pre-release: Build"
    needs: [check, verify]
    if: ${{ needs.check.outputs.release != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.find_vsix.outputs.vsix }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    # Writes the version into package.json in this checkout only. Nothing is committed, and
    # CHANGELOG.md is deliberately left alone -- a pre-release is not a release.
    - name: Resolve the pre-release version
      id: version
      run: node scripts/prerelease-version.js --apply
    - name: Package the pre-release VSIX
      run: npm run package:pre-release
    - name: Find VSIX
      id: find_vsix
      run: |
        vsix=$(ls *.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::No .vsix file found after packaging"
          exit 1
        fi
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
    # The three publish jobs below run on their own runners, so the bytes have to travel as an
    # artifact. All three get the same ones, which is what "the same build is on both registries"
    # means.
    - name: Upload the VSIX
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pre-release-vsix
        path: ${{ steps.find_vsix.outputs.vsix }}
        if-no-files-found: error
        retention-days: 5

  pre-release-marketplace:
    name: "Pre-release: VS Code Marketplace"
    needs: build-pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSIX: ${{ needs.build-pre-release.outputs.vsix }}
    steps:
    # vsce is a dev dependency, so this job needs the tree even though it publishes a .vsix that
    # was built elsewhere. The other two publish jobs need neither a checkout nor node.
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: pre-release-vsix
    # The script checks the token, retries a gallery timeout, and treats a version that is already
    # up as done. A missing token is an error that says what to create, never a green skip.
    - name: Publish to VS Code Marketplace
      run: node scripts/publish-marketplace.js --vsix "$VSIX" --pre-release

  # No preRelease input: ovsx answers "Ignoring option '--pre-release' for prepackaged extension"
  # and reads the flag out of the manifest instead, where `vsce package --pre-release` already put
  # it. extensionFile is the input that takes a built .vsix; packagePath is a directory to package.
  pre-release-open-vsx:
    name: "Pre-release: Open VSX"
    needs: build-pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: pre-release-vsix
    # A missing token used to skip the publish step and leave the job green, which is how the
    # extension went months without ever reaching Open VSX while every run said success. Nothing
    # here is optional any more: no token is a failure, and it says what to do about it.
    - name: Check the Open VSX token
      run: |
        if [ -z "$OPEN_VSX_TOKEN" ]; then
          echo "::error::OPEN_VSX_TOKEN is not set, so nothing can reach Open VSX. Create an access"
          echo "::error::token at https://open-vsx.org/user-settings/tokens and add it as the"
          echo "::error::repository secret OPEN_VSX_TOKEN. The publisher namespace has to exist"
          echo "::error::first: npx ovsx create-namespace MilleniumDawnModTeam -p <token>."
          exit 1
        fi
    - name: Publish to Open VSX Registry
      uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
      with:
        extensionFile: ${{ needs.build-pre-release.outputs.vsix }}
        pat: ${{ env.OPEN_VSX_TOKEN }}
        registryUrl: https://open-vsx.org

  pre-release-github:
    name: "Pre-release: GitHub prerelease"
    needs: build-pre-release
    runs-on: ubuntu-latest
    # The prerelease is created with the bot's token, so nothing here writes as the workflow.
    permissions:
      contents: read
    steps:
    # Same identity as a release: what the automation publishes is published by the bot.
    - name: Mint the release bot token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.RELEASE_PR_APP_ID }}
        private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: pre-release-vsix
    # generate_release_notes would draw its notes from the previous stable tag, which is a whole
    # release behind. The commit this was built from is the useful thing to say instead.
    - name: Create GitHub prerelease
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        tag_name: ${{ needs.build-pre-release.outputs.tag }}
        name: Pre-release ${{ needs.build-pre-release.outputs.version }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        body: |
          Pre-release build of ${{ github.sha }}.

          The same build is on the VS Code Marketplace and Open VSX on the pre-release channel, so
          "Switch to Pre-Release Version" in the extension view gets you this without downloading
          anything. The `.vsix` below is for installing it by hand.
        files: ${{ needs.build-pre-release.outputs.vsix }}

  # --- Release: only the push that merged the release pull request. ---

  build-release:
    name: "Release: Build"
    needs: [check, verify]
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      vsix: ${{ steps.find_vsix.outputs.vsix }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Package VSIX
      run: npm run package
    - name: Find VSIX
      id: find_vsix
      run: |
        vsix=$(ls *.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::No .vsix file found after packaging"
          exit 1
        fi
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
    - name: Upload the VSIX
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-vsix
        path: ${{ steps.find_vsix.outputs.vsix }}
        if-no-files-found: error
        retention-days: 5

  # The three below are deliberately siblings rather than steps in a row. Open VSX used to be a step
  # after the Marketplace one, so a Marketplace outage took Open VSX and the GitHub release down with
  # it; now one registry being unreachable costs exactly that registry, and re-running a single
  # failed job republishes only that target.
  release-marketplace:
    name: "Release: VS Code Marketplace"
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSIX: ${{ needs.build-release.outputs.vsix }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release-vsix
    # A gallery timeout is retried rather than failed, and a version that is already up is a
    # success, not a failure: it is what a re-run of this one job -- or the merge of the fix pull
    # request -- answers once the version is there, which is what makes publishing a half-finished
    # release again safe. A missing token is an error that says what to create, never a green skip.
    - name: Publish to VS Code Marketplace
      run: node scripts/publish-marketplace.js --vsix "$VSIX"

  # extensionFile, not packagePath: packagePath is a directory the action packages itself, and
  # pointing it at a .vsix made it read <file>.vsix/package.json and fail. Both registries get the
  # same bytes, out of the same artifact.
  release-open-vsx:
    name: "Release: Open VSX"
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
    steps:
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release-vsix
    - name: Check the Open VSX token
      run: |
        if [ -z "$OPEN_VSX_TOKEN" ]; then
          echo "::error::OPEN_VSX_TOKEN is not set, so nothing can reach Open VSX. Create an access"
          echo "::error::token at https://open-vsx.org/user-settings/tokens and add it as the"
          echo "::error::repository secret OPEN_VSX_TOKEN. The publisher namespace has to exist"
          echo "::error::first: npx ovsx create-namespace MilleniumDawnModTeam -p <token>."
          exit 1
        fi
    # skipDuplicate: publishing a version Open VSX already has is what the merge of the fix pull
    # request does when it was another registry that failed, and that is done, not an error.
    - name: Publish to Open VSX Registry
      uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
      with:
        extensionFile: ${{ needs.build-release.outputs.vsix }}
        pat: ${{ env.OPEN_VSX_TOKEN }}
        registryUrl: https://open-vsx.org
        skipDuplicate: true

  # Publishing again with the tag and release already there updates the release in place and
  # replaces the .vsix on it (overwrite_files defaults to true), so this job needs no duplicate
  # handling of its own.
  release-github:
    name: "Release: GitHub release"
    needs: [check, build-release]
    runs-on: ubuntu-latest
    # The release itself is created with the bot's token, so nothing here writes as the workflow.
    permissions:
      contents: read
    steps:
    # The release and its tag are published by the MD Utilities Release Bot. Unlike GITHUB_TOKEN an
    # App token does fire `release: published`, so close-fixed-issues.yml finally runs on a release
    # -- its own guard keeps the pre-release builds out of that.
    - name: Mint the release bot token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.RELEASE_PR_APP_ID }}
        private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: release-vsix
    - name: Create GitHub Release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        token: ${{ steps.app-token.outputs.token }}
        tag_name: ${{ needs.check.outputs.tag }}
        name: ${{ needs.check.outputs.tag }}
        generate_release_notes: true
        files: ${{ needs.build-release.outputs.vsix }}

  # A failed release used to be a red run and nothing else. Now it leaves a branch and a draft pull
  # request behind, so fixing it is a checkout rather than an archaeology dig through the log.
  # Merging that pull request is the release: release-check.js recognises the branch name and
  # publishes the version again, so the fix does not wait on a second release pull request.
  #
  # Only a release gets one. A pre-release runs on every push to main and the next push supersedes
  # it, so a pull request per failed pre-release would be noise.
  release-failed:
    name: "Release: Open a fix pull request"
    needs: [check, verify, build-release, release-marketplace, release-open-vsx, release-github]
    # `failure` only, and never `cancelled`: a run someone stopped by hand is not a problem to fix.
    # The join is how a job id with a hyphen in it stays out of the expression -- `needs.*.result`
    # covers exactly the jobs listed above.
    if: ${{ always() && needs.check.outputs.release == 'true' && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    # Everything below writes as the bot, through GH_TOKEN and the checkout token.
    permissions:
      contents: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      BRANCH: fix/release-v${{ needs.check.outputs.version }}
    steps:
    - name: Mint the release bot token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ secrets.RELEASE_PR_APP_ID }}
        private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
    # A job-level `env` cannot read the `steps` context, so the token every `gh` step below wants is
    # exported once here instead. The action masks it, so it stays redacted in the log.
    - name: Use the bot token for gh
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
    - name: Configure git
      env:
        SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        id=$(gh api "users/$SLUG%5Bbot%5D" --jq .id)
        git config user.name "${SLUG}[bot]"
        git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
    # Which jobs failed, and a link straight to each log. The run's own job list is the honest
    # answer -- it names the ones that succeeded too, so it is clear what already reached a
    # registry. This job itself and the skipped ones -- the pre-release jobs and the release pull
    # request job, neither of which runs on a release push -- are left out.
    - name: Write the failure summary
      id: summary
      run: |
        set -euo pipefail
        body="$RUNNER_TEMP/release-failure.md"
        {
          echo "Publishing **$TAG** failed."
          echo
          echo "This branch is here to fix it on. It carries one empty commit and nothing else, so"
          echo "there is nothing to clean up -- push the fix, mark this ready and merge it. **That"
          echo "merge publishes $TAG again**: every target treats a version it already has as done,"
          echo "so only the ones that failed actually change. No release pull request is involved."
          echo
          echo "If the fix changes what ships -- anything outside \`.github/\` and documentation --"
          echo "bump \`package.json\` and the \`Unreleased\` heading in \`CHANGELOG.md\` on this branch"
          echo "first (\`node scripts/bump-version.js --type patch\`), so the new build goes out"
          echo "under its own version instead of replacing $TAG on the targets that already have it."
          echo
          echo "### This run"
          echo
          # Tolerated, not required: a rate-limited job list is no reason to withhold the branch.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[]
              | select(.name != "Release: Open a fix pull request")
              | select(.conclusion != "skipped")
              | "- **\(.conclusion // "running")** — [\(.name)](\(.html_url))"' \
            || echo "- The job list could not be read; open the run below."
          echo
          echo "A target that says \`success\` is already published. Re-running just the failed job"
          echo "from [the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          echo "republishes only that one; the Marketplace step treats a version that is already up"
          echo "as done rather than as an error."
        } > "$body"
        echo "body=$body" >> "$GITHUB_OUTPUT"
    - name: Open or update the fix pull request
      env:
        BODY: ${{ steps.summary.outputs.body }}
      run: |
        set -euo pipefail
        title="Release $TAG failed to publish"

        # A branch with an open pull request belongs to whoever is fixing this version, and their
        # commits are not ours to force over. The new run gets reported on their pull request
        # instead. A branch with no open pull request is a leftover -- the merge deleted it, so
        # what is left is one that was closed unmerged -- and `gh pr create` on it would fail
        # with "no commits between main and the branch", so it is started over from this commit.
        if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr comment "$number" --body-file "$BODY"
            echo "::notice::$title -- reported on pull request #$number."
            exit 0
          fi
        fi
        git checkout -B "$BRANCH" "$GITHUB_SHA"
        git commit --allow-empty -m "$title"
        git push --force origin "HEAD:$BRANCH"

        # No labels: a label is what decides where a seeded changelog bullet lands, and this pull
        # request is a workspace, not a change. Whatever fix lands on it labels itself.
        url=$(gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$BODY")
        echo "::notice::$title -- opened $url."
