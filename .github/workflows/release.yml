on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

name: Release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - name: Check version
      id: check
      run: |
        version=$(node -p "require('./package.json').version")
        tag="v${version}"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
          echo "::warning::Tag $tag already exists, so nothing was built or published. Bump the version in package.json to release these changes."
          echo "should_release=false" >> "$GITHUB_OUTPUT"
        else
          echo "Tag $tag does not exist; will release."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: ${{ steps.check.outputs.should_release == 'true' }}
      with:
        node-version: 20
        cache: 'npm'
    - name: Install dependencies
      if: ${{ steps.check.outputs.should_release == 'true' }}
      run: npm ci
    - name: Lint
      if: ${{ steps.check.outputs.should_release == 'true' }}
      run: npm run lint
    - name: Test
      if: ${{ steps.check.outputs.should_release == 'true' }}
      run: npm test
    - name: Package VSIX
      if: ${{ steps.check.outputs.should_release == 'true' }}
      run: npm run package
    - name: Find VSIX
      id: find_vsix
      if: ${{ steps.check.outputs.should_release == 'true' }}
      run: |
        vsix=$(ls *.vsix 2>/dev/null | head -1)
        if [ -z "$vsix" ]; then
          echo "::error::No .vsix file found after packaging"
          exit 1
        fi
        echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
    - name: Publish to VS Code Marketplace
      if: ${{ steps.check.outputs.should_release == 'true' && env.VSCE_PAT != '' }}
      run: |
        set -o pipefail
        out=$(npx --no-install @vscode/vsce publish --packagePath "${{ steps.find_vsix.outputs.vsix }}" --pat "$VSCE_PAT" 2>&1 | tee /dev/stderr) || {
          if echo "$out" | grep -qi "already exists"; then
            echo "::warning::Version already exists on the Marketplace; treating as already published."
            exit 0
          fi
          exit 1
        }
    - name: Publish to Open VSX Registry
      if: ${{ steps.check.outputs.should_release == 'true' && env.OPEN_VSX_TOKEN != '' }}
      uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
      with:
        packagePath: ${{ steps.find_vsix.outputs.vsix }}
        pat: ${{ env.OPEN_VSX_TOKEN }}
        registryUrl: https://open-vsx.org
    - name: Create GitHub Release
      if: ${{ steps.check.outputs.should_release == 'true' }}
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        tag_name: ${{ steps.check.outputs.tag }}
        name: ${{ steps.check.outputs.tag }}
        generate_release_notes: true
        files: ${{ steps.find_vsix.outputs.vsix }}
