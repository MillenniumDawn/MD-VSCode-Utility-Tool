on:
  # No branch filter: it would name the base branch, and "*" does not match a "/" -- so a pull
  # request into a branch such as release/version-bump ran no tests at all.
  pull_request:
  # For re-running the suite against a branch by hand. The release pull request no longer needs it:
  # it is opened by the release bot's App token, and a pull request from one of those starts a run
  # like anyone else's.
  workflow_dispatch:

name: Test

# The job runs npm lifecycle scripts and webpack over branch code, so the token it gets should open
# nothing but the tree.
permissions:
  contents: read

# The release pull request is pushed to again on every merge into main, so without this a run would
# be left going while its own commit is already outdated. A dispatched run has no pull request
# number, so it groups by ref instead: reruns of the same branch still supersede each other, while
# dispatches on unrelated refs no longer cancel one another.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run is two to three minutes; the cap leaves room for a VS Code download on a cache
    # miss without letting a hung Electron sit for GitHub's six-hour default.
    timeout-minutes: 30

    steps:
      # Depth 2, not 1: on a pull request HEAD is the merge commit, so its first parent is the base
      # branch as of this run, and that is what the changed-lines coverage step diffs against.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # @vscode/test-electron skips the download when .vscode-test/vscode-<version> already exists.
      # Keyed on the file that carries the pinned version, so moving the pin is the only thing that
      # fetches a new build.
      - name: Cache VS Code build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('src/test/integration/runTest.ts') }}
      - name: Lint
        run: npm run lint
      # Fails only above the threshold in .jscpd.json, so the number can be walked down over time
      # instead of blocking every branch that touches a file already carrying a clone.
      - name: Duplication
        run: npm run dupes
      - name: Compile tests
        run: npm run pretest
      # The c8 thresholds in package.json sit a few points under the real figure, which leaves
      # room for thousands of untested lines before they fail. This is the rule that matters: the
      # lines a pull request adds or changes must themselves be covered. Skipped on a dispatch,
      # which has no base to diff against.
      - name: Test with coverage
        run: npm run test:coverage
      - name: Coverage on changed lines
        if: github.event_name == 'pull_request'
        run: node scripts/diff-coverage.js --base HEAD^1 --min 80
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 5
      - name: Package VSIX
        run: npm run package
      # The unit tests compile webviewsrc to commonjs, where an exported const read before its
      # declaration answers `undefined` instead of throwing. What ships is ESM, where the same read
      # throws and the preview draws its toolbar over an empty canvas, so the bundles are evaluated
      # here -- against the production build `npm run package` just wrote.
      - name: Smoke test webview bundles
        run: npm run smoke:webviews
      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: md-vscode-utility-tool.vsix
          path: "*.vsix"
          retention-days: 5
      # Runs against the production bundle `npm run package` wrote to dist/ and the test build
      # `pretest` wrote to out-test/, so nothing is installed or compiled a second time for it. It
      # comes after the uploads so the .vsix and coverage are still there when this step fails.
      - name: Run integration smoke tests
        run: xvfb-run -a npm run test:integration
