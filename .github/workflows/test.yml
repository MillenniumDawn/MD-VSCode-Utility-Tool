---
"on":
  # No base-branch filter: "*" does not match the "/" in release/version-bump.
  pull_request:
  # Manual reruns. The release bot's App token starts PR runs automatically.
  workflow_dispatch:

name: Test

# Branch code runs npm scripts and webpack; its token only needs to read.
permissions:
  contents: read

# Cancel outdated runs of the same PR, or the same ref for manual dispatches.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Leave room for a VS Code download, but cap a hung Electron run.
    timeout-minutes: 30

    steps:
      # PR HEAD is the merge commit; coverage diffs against its first parent.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Key reusable test-electron builds on their version pin.
      - name: Cache VS Code build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .vscode-test/vscode-*
          key: >-
            vscode-test-${{ runner.os }}-${{
            hashFiles('src/test/integration/runTest.ts') }}
      - name: Lint
        run: npm run lint
      - name: Type-check production sources
        run: npx --no-install tsc --noEmit -p tsconfig.json
      - name: Check unused code
        run: npm run knip
      # The .jscpd.json threshold allows existing clones while it is lowered.
      - name: Duplication
        run: npm run dupes
      # The pre hook compiles both projects. Check changed-line coverage too;
      # whole-suite thresholds leave room for untested additions.
      # Manual dispatches have no PR base to diff against.
      - name: Test with coverage
        run: npm run test:coverage
      - name: Coverage on changed lines
        if: github.event_name == 'pull_request'
        run: node scripts/diff-coverage.js --base HEAD^1 --min 80
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 5
      - name: Package VSIX
        run: npm run package
      # ESM throws on a const read before declaration where test CommonJS may
      # return undefined. Evaluate the production bundles, not only test output.
      - name: Smoke test webview bundles
        run: npm run smoke:webviews
      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: md-vscode-utility-tool.vsix
          path: "*.vsix"
          retention-days: 5
      # Reuse dist/ and out-test/. Upload first to keep artifacts on failure.
      - name: Run integration smoke tests
        run: xvfb-run -a npm run test:integration
      - name: Run browser smoke tests
        run: npm run test:web

  # Ubuntu runs the suite under coverage; keep a separate Windows check.
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Unit tests
        run: npm test
