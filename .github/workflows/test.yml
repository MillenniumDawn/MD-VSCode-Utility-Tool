on:
  pull_request:
    branches:
      - "*"
  # The release pull request is opened and pushed to with GITHUB_TOKEN, and a pull request from
  # that token starts no run by design. Dispatching is the exception to that rule, so
  # version-bump.yml asks for a run against release/version-bump itself -- see the last step there.
  workflow_dispatch:

name: Test

# The release pull request is pushed to again on every merge into main, so without this a run would
# be left going while its own commit is already outdated. A dispatched run has no pull request
# number, so it groups by ref instead: refreshes of the same branch still supersede each other,
# while dispatches on unrelated refs no longer cancel one another.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compile tests
        run: npm run pretest
      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 5
      - name: Package VSIX
        run: npm run package
      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: md-vscode-utility-tool.vsix
          path: "*.vsix"
          retention-days: 5

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run webpack
      - name: Compile tests
        run: npm run pretest
      - name: Run integration smoke tests
        run: xvfb-run -a npm run test:integration
