# Every action in .github/workflows is pinned to a commit, and every dependency to a lock file;
# this is what moves either of them. Dependabot only opens ordinary pull requests against main --
# it never touches release/version-bump, and nothing here merges on its own. A merged dependency
# bump is a shipped change like any other, so it refreshes the open release pull request, but
# scripts/pr-bullets.js writes no changelog bullet for a pull request Dependabot authored.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # One pull request for every pin that moved that week, not one per action.
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # What ships is bundled from the production dependencies; everything else is tooling. Two
    # groups so a bump that can change the extension is reviewed apart from one that cannot.
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
